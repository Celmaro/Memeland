# Gitleaks configuration — Memeland
#
# docs/research/ is a research-notes directory. It documents vulnerabilities
# and LEAKED SECRETS found in EXTERNAL third-party repos during source audits
# (e.g. the SRC-147 4Meme-Pilot audit quoted a real AGENT_API_SECRET found in
# that project's committed .env.example, to warn against copying the pattern).
# Quoting a third-party's leaked key in research notes is intentional
# documentation of a finding — it is NOT a Memeland credential. Exclude this
# directory so legitimate audit notes don't trip the scanner, while all actual
# code, config, and shipped docs remain fully scanned.

[extend]
useDefault = true

[[allowlist]]
paths = ['''docs/research/''']
